name: ci

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  bench-tests:
    # Linux portability check for the M0 bench harness (DR-0003). CPU only.
    # demucs and model weights are deliberately NOT installed: CI makes no model or
    # dataset downloads, so the real-weight smoke tests skip here and run locally.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies (versions from requirements.lock.txt)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.2.2"
          python -m pip install "numpy==1.26.4" "scipy==1.17.1" "soundfile==0.13.1" \
            "onnxruntime==1.23.2" "PyYAML==6.0.3" "pytest==9.1.1"
      - name: Tests
        run: python -m pytest -q -rs
